[server]
maxUploadSize = 50
enableStaticServing = true

# Tema zamrud & emas. Blok ini mengatur warna widget bawaan Streamlit
# (slider, radio, tab, kotak centang, spinner) yang tidak bisa dijangkau CSS biasa.
[theme]
base = "light"
primaryColor = "#C6A15B"
backgroundColor = "#F4F0E7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#202824"
linkColor = "#6B5526"
borderColor = "#DCE7DF"
font = "IBM Plex Sans, system-ui, sans-serif"
headingFont = "Newsreader, Georgia, serif"
codeFont = "IBM Plex Mono, monospace"
baseRadius = "0.6rem"
